# YOLOv8-Pose dataset template for people lying in the target bed region.
# Create the folder tree described in POSE_TRAINING_GUIDE.md before training.
path: ./pose_bed_dataset
train: images/train
val: images/val
test: images/test

# 17 COCO joints: x, y, visibility for each joint.
kpt_shape: [17, 3]
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

names:
  0: lying_person

kpt_names:
  0: [nose, left_eye, right_eye, left_ear, right_ear,
      left_shoulder, right_shoulder, left_elbow, right_elbow,
      left_wrist, right_wrist, left_hip, right_hip,
      left_knee, right_knee, left_ankle, right_ankle]
